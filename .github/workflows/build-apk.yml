name: APK Oluştur

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Android klasör yapısını hazırla
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/dersprogramim/app
          mkdir -p app/src/main/res/values

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java app/src/main/java/com/dersprogramim/app/MainActivity.java
          cp index.html app/src/main/assets/index.html
          cp style.css app/src/main/assets/style.css
          cp app.js app/src/main/assets/app.js
          cp styles.xml app/src/main/res/values/styles.xml

          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") }
          android {
              namespace = "com.dersprogramim.app"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.dersprogramim.app"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF

      - name: Düzeltilmiş Android yapısını repoya kaydet
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git rm -f AndroidManifest.xml MainActivity.java index.html style.css app.js styles.xml || true
          if ! git diff --cached --quiet; then
            git commit -m "Fix Android project structure"
            git push || echo "Repo güncellemesi yapılamadı; APK build devam ediyor."
          fi

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android 36 bileşenlerini kur
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Debug APK oluştur
        run: gradle :app:assembleDebug --stacktrace

      - name: APK'yı Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: ders-programim-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

