name: Fotoğraftan Program Özelliğini Kur

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Fotoğraf OCR özelliğini kur
        shell: bash
        run: |
          set -e
          mkdir -p "$(dirname app/build.gradle.kts)"
          echo  | base64 -d > app/build.gradle.kts
          mkdir -p "$(dirname app/src/main/java/com/dersprogramim/app/MainActivity.java)"
          echo  | base64 -d > app/src/main/java/com/dersprogramim/app/MainActivity.java
          mkdir -p "$(dirname app/src/main/assets/index.html)"
          echo  | base64 -d > app/src/main/assets/index.html
          mkdir -p "$(dirname app/src/main/assets/app.js)"
          echo  | base64 -d > app/src/main/assets/app.js
          mkdir -p "$(dirname app/src/main/assets/style.css)"
          echo  | base64 -d > app/src/main/assets/style.css
          echo  | base64 -d > .github/workflows/build-apk.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Add photo OCR program import"
          git push

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK bileşenlerini kur
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Debug APK oluştur
        run: gradle :app:assembleDebug --stacktrace

      - name: APK'yı Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: ders-programim-apk-photo-v1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
